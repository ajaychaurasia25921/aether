quarkus.application.name=agent-registry-service
quarkus.http.port=8081

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${AETHER_REGISTRY_DB_USERNAME:aether}
quarkus.datasource.password=${AETHER_REGISTRY_DB_PASSWORD:aether}
quarkus.datasource.jdbc.url=${AETHER_REGISTRY_DB_URL:jdbc:postgresql://localhost:5432/aether_registry}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.oidc.auth-server-url=${AETHER_OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/aether}
quarkus.oidc.client-id=${AETHER_OIDC_CLIENT_ID:agent-registry-service}
quarkus.oidc.credentials.secret=${AETHER_OIDC_CLIENT_SECRET:dev-secret}
quarkus.oidc.application-type=service

kafka.bootstrap.servers=${AETHER_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.outgoing.agent-export-requested.connector=smallrye-kafka
mp.messaging.outgoing.agent-export-requested.topic=agent.export.requested
mp.messaging.outgoing.agent-export-requested.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.agent-export-completed.connector=smallrye-kafka
mp.messaging.incoming.agent-export-completed.topic=agent.export.completed
mp.messaging.incoming.agent-export-completed.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.agent-export-completed.auto.offset.reset=earliest

mp.messaging.incoming.agent-export-failed.connector=smallrye-kafka
mp.messaging.incoming.agent-export-failed.topic=agent.export.failed
mp.messaging.incoming.agent-export-failed.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.agent-export-failed.auto.offset.reset=earliest

mp.messaging.outgoing.agent-export-dlq.connector=smallrye-kafka
mp.messaging.outgoing.agent-export-dlq.topic=agent.export.dlq
mp.messaging.outgoing.agent-export-dlq.value.serializer=org.apache.kafka.common.serialization.StringSerializer

quarkus.smallrye-openapi.info-title=Aether Agent Registry Service
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=Agent registry, versioning, scopes, and export job APIs for Aegis Flow.

quarkus.micrometer.export.prometheus.path=/metrics
quarkus.otel.enabled=${AETHER_OTEL_ENABLED:false}
quarkus.otel.service.name=agent-registry-service
quarkus.otel.traces.exporter=${AETHER_OTEL_TRACES_EXPORTER:none}
